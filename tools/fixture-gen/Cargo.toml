[package]
name = "fixture-gen"
version = "0.1.0"
description = "Seeded generator of the labeled synthetic preflop fixture sets (R2.20, O-30, O-57)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# Edges: gto-model, gto-tree (the real pair trees and their node keys), gto-library (the
# manifest types) and library-pack (the pack with its criterion 2 invariants). Never
# gto-solve: a synthetic set is not a solve, and the fixture path stays solver-free
# (ADR 0018, O-225).
[dependencies]
gto-model = { workspace = true }
gto-tree = { workspace = true }
gto-library = { workspace = true }
library-pack = { workspace = true }
serde = { workspace = true }
# float_roundtrip on purpose: tools/validate turns it on, and cargo unifies features across every
# package of one invocation, so without it here a workspace build (just rust-test) parsed the
# equity table's floats differently from `cargo run -p fixture-gen` alone, which changed every
# dump's sha256 and so every synthetic solution id. With the feature named here the generator
# writes the same bytes under any package selection (O-131, O-225).
serde_json = { workspace = true, features = ["float_roundtrip"] }
rand = { workspace = true }
rand_chacha = { workspace = true }
thiserror = { workspace = true }
# The node dumps go to a temporary directory, never into the repository.
tempfile = { workspace = true }

[lints]
workspace = true
