# Compose for the g-tee-oh dev and mac profiles (R0.5, A1 section 6). Run from the repo root with
# --project-directory . so .env and the relative bind mounts resolve from there (the justfile's COMPOSE):
#   docker compose --project-directory . -f infra/compose/compose.yaml --profile dev up -d --wait
#
# Profiles: dev (Zenbook, Docker Desktop with the WSL2 (Windows Subsystem for Linux 2) backend) publishes
# Postgres and the S3 (Simple Storage Service) gateway on 127.0.0.1 and carries no limits; mac (M2 Pro
# service, 02 section 6.2) carries the memory limits and restart: unless-stopped and publishes only Caddy.
# Each service body is one YAML (YAML Ain't Markup Language) anchor shared by a dev entry and a mac entry,
# so the profiles differ only in ports, limits and restart policy. The mac entries carry the plain names
# postgres, seaweedfs and caddy as network aliases, so api and web reach them under one name in both
# profiles. solver-query, api and web have dev entries only; S34 adds their mac entries from the same
# anchors.
#
# Services (A5 section 1): postgres:18-alpine (uuidv7() is native in Postgres 18, A4 section 1;
# architecture decision record (ADR) 0005), SeaweedFS in single-server mode with the S3 gateway on 8333 and
# two buckets with separate credentials (ADR 0019, 02 section 6.4), the one-shot bucket-init that creates
# those buckets, solver-query (built from infra/docker/solver-query.Dockerfile, port 7070, the fixture
# library bind-mounted read-only at /fixtures/library from FIXTURE_LIBRARY_PATH, O-62), api (built from
# infra/docker/api.Dockerfile, port 8080, behind Caddy at /api/*), web (built from infra/docker/web.Dockerfile,
# port 8080, the static build) and Caddy on 80 and 443 with TLS (Transport Layer Security) from its internal
# certificate authority (A9 section 3). Only Caddy publishes a port on the LAN (local area network). Every
# service sits on the one network gto. The three built images carry their own HEALTHCHECK, so no healthcheck
# block repeats it here; "just dev-up" runs up --build, so a source change is rebuilt rather than hot
# reloaded (O-122). The three built services run hardened the same way (A9 section 3): read-only
# root filesystem, every capability dropped, no privilege escalation, and a tmpfs on each path the
# process still writes, so a write anywhere else fails loudly instead of persisting in the container.
#
# library-builder (S18, R2.18) is the one service that solves (ADR 0018). It has a single entry under the
# profiles builder and mac only, so "just dev-up" and the e2e job never start it (O-189): on the Zenbook it
# runs with --profile dev --profile builder, on the Mac with --profile mac. Its operations port 7071
# (/healthz and /metrics) stays inside the network gto, unpublished and unauthenticated (O-207).

x-postgres: &postgres
  image: postgres:18-alpine
  environment:
    POSTGRES_DB: gto
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Read by infra/compose/postgres-init/10-role-logins.sql on the first run (O-28)
    APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    BUILDER_DB_PASSWORD: ${BUILDER_DB_PASSWORD:?set BUILDER_DB_PASSWORD in .env}
    CAPTURE_DB_PASSWORD: ${CAPTURE_DB_PASSWORD:?set CAPTURE_DB_PASSWORD in .env}
    QUERY_DB_PASSWORD: ${QUERY_DB_PASSWORD:?set QUERY_DB_PASSWORD in .env}
  volumes:
    # postgres:18 keeps PGDATA at /var/lib/postgresql/18/docker and declares its volume one level up
    - postgres_data:/var/lib/postgresql
    - ./infra/compose/postgres-init:/docker-entrypoint-initdb.d:ro
  healthcheck:
    # Over TCP (Transmission Control Protocol) on purpose: the first-run init serves a socket-only temporary
    # server, which must not count as healthy
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d gto"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 30s
  networks:
    gto: {}

x-seaweedfs: &seaweedfs
  image: chrislusf/seaweedfs:4.48
  # start.sh renders the identity template with the credentials below, then execs weed server
  entrypoint: ["/bin/sh", "/etc/seaweedfs/start.sh"]
  environment:
    S3_ADMIN_ACCESS_KEY: ${S3_ADMIN_ACCESS_KEY:?set S3_ADMIN_ACCESS_KEY in .env}
    S3_ADMIN_SECRET_KEY: ${S3_ADMIN_SECRET_KEY:?set S3_ADMIN_SECRET_KEY in .env}
    S3_LIBRARY_ACCESS_KEY: ${S3_LIBRARY_ACCESS_KEY:?set S3_LIBRARY_ACCESS_KEY in .env}
    S3_LIBRARY_SECRET_KEY: ${S3_LIBRARY_SECRET_KEY:?set S3_LIBRARY_SECRET_KEY in .env}
    S3_REFERENCE_ACCESS_KEY: ${S3_REFERENCE_ACCESS_KEY:?set S3_REFERENCE_ACCESS_KEY in .env}
    S3_REFERENCE_SECRET_KEY: ${S3_REFERENCE_SECRET_KEY:?set S3_REFERENCE_SECRET_KEY in .env}
  volumes:
    - seaweedfs_data:/data
    - ./infra/compose/seaweedfs/start.sh:/etc/seaweedfs/start.sh:ro
    - ./infra/compose/seaweedfs/s3-identities.json:/etc/seaweedfs/s3-identities.json:ro
  healthcheck:
    # The S3 gateway's unauthenticated readiness route; healthy means the gateway accepts requests. busybox
    # wget ships in the alpine-based image and fails on any non-2xx answer, so no curl is assumed there.
    test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 20s
  networks:
    gto: {}

x-bucket-init: &bucket-init
  image: curlimages/curl:8.23.0
  entrypoint: ["/bin/sh", "/create-buckets.sh"]
  environment:
    S3_INTERNAL_ENDPOINT: http://seaweedfs:8333
    S3_ADMIN_ACCESS_KEY: ${S3_ADMIN_ACCESS_KEY:?set S3_ADMIN_ACCESS_KEY in .env}
    S3_ADMIN_SECRET_KEY: ${S3_ADMIN_SECRET_KEY:?set S3_ADMIN_SECRET_KEY in .env}
  volumes:
    - ./infra/compose/seaweedfs/create-buckets.sh:/create-buckets.sh:ro
  # A one-shot: it exits 0 once both buckets exist and is never restarted, in either profile
  restart: "no"
  networks:
    gto: {}

x-caddy: &caddy
  image: caddy:2-alpine
  environment:
    CADDY_SITE: ${CADDY_SITE:-localhost}
  ports:
    - "80:80"
    - "443:443"
  volumes:
    - ./infra/compose/Caddyfile:/etc/caddy/Caddyfile:ro
    # The internal certificate authority root lives under /data; keep it across restarts
    - caddy_data:/data
    - caddy_config:/config
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 10s
  networks:
    gto: {}

x-solver-query: &solver-query
  build:
    context: .
    dockerfile: infra/docker/solver-query.Dockerfile
  environment:
    SOLVER_QUERY_BIND: "0.0.0.0:7070"
    # The container path is fixed; the host side of the bind mount below comes from FIXTURE_LIBRARY_PATH
    FIXTURE_LIBRARY_PATH: /fixtures/library
    QUERY_CACHE_BYTES: ${QUERY_CACHE_BYTES:?set QUERY_CACHE_BYTES in .env}
    # O-146: the query-role connection from its parts, never a connection string. The service
    # builds the connection with sqlx's options builder, so .env keeps one password per role
    # (O-28), a password with a URL-significant character (@ / ? # %) needs no percent-encoding
    # and nothing that holds the password is ever logged. The host is this service's name (the
    # binary's default, 127.0.0.1, fits a run on the host) and sslmode is off on the private
    # network gto; port, database and login keep the binary's defaults (5432, gto, query_login).
    # The service opens its pool lazily, so no depends_on postgres is needed: it starts before
    # Postgres is healthy and /healthz reports the database block once it answers.
    QUERY_DB_HOST: postgres
    QUERY_DB_PASSWORD: ${QUERY_DB_PASSWORD:?set QUERY_DB_PASSWORD in .env}
    QUERY_DB_SSLMODE: disable
  volumes:
    # O-62: the host directory from .env, read-only; empty or unset falls back to the placeholder directory
    # (its README says what S19 puts there). Relative to the project directory, which is the repo root.
    - ${FIXTURE_LIBRARY_PATH:-./validation/fixtures/library}:/fixtures/library:ro
  # A9 section 3: no writable root filesystem, no capabilities, no privilege escalation. The image's own
  # HEALTHCHECK (the binary's healthz self-probe) is the health probe.
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks:
    gto: {}

x-api: &api
  build:
    context: .
    dockerfile: infra/docker/api.Dockerfile
  environment:
    API_PORT: "8080"
    # The app role login (O-28); the image's HEALTHCHECK probes GET /healthz with Node's fetch
    APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    # The database the api connects to as app_login (S21, services/api/src/config.ts)
    PGHOST: postgres
    PGPORT: "5432"
    PGDATABASE: gto
    PGUSER: app_login
    # The one browser origin CORS and the CSRF Origin check accept: the Caddy site (O-230)
    APP_ORIGIN: https://${CADDY_SITE:-localhost}
    # Believe X-Forwarded-For from private addresses only: the api publishes no port, so only containers
    # on the gto network (Caddy) can reach it; outside compose the api trusts loopback only (O-236)
    TRUSTED_PROXIES: uniquelocal
  # A9 section 3, the same hardening as solver-query. Node writes nothing of its own; /tmp is a
  # tmpfs so os.tmpdir() keeps working for a scratch file (private to the container, gone with it).
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp
  networks:
    gto: {}

x-web: &web
  build:
    context: .
    dockerfile: infra/docker/web.Dockerfile
  # The image's HEALTHCHECK probes GET / on 8080 with busybox wget
  # A9 section 3, the same hardening as solver-query. Caddy's data (XDG_DATA_HOME) and config
  # (XDG_CONFIG_HOME) directories are /data and /config in the image; with admin off and auto_https
  # off nothing persistent lands there, but Caddy still creates them at start, so both are tmpfs
  # mounts rather than holes in the read-only root.
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /data
    - /config
  networks:
    gto: {}

services:
  postgres:
    <<: *postgres
    profiles: [dev]
    ports:
      - "127.0.0.1:5432:5432"

  seaweedfs:
    <<: *seaweedfs
    profiles: [dev]
    ports:
      - "127.0.0.1:8333:8333"

  bucket-init:
    <<: *bucket-init
    profiles: [dev]
    depends_on:
      seaweedfs:
        condition: service_healthy

  solver-query:
    <<: *solver-query
    profiles: [dev]

  api:
    <<: *api
    profiles: [dev]
    depends_on:
      postgres:
        condition: service_healthy
      solver-query:
        condition: service_healthy

  web:
    <<: *web
    profiles: [dev]

  caddy:
    <<: *caddy
    profiles: [dev]
    # Both upstreams exist before Caddy starts, so its 503 "not deployed yet" branch never shows in e2e
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started

  postgres-mac:
    <<: *postgres
    profiles: [mac]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      gto:
        aliases: [postgres]

  seaweedfs-mac:
    <<: *seaweedfs
    profiles: [mac]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      gto:
        aliases: [seaweedfs]

  bucket-init-mac:
    <<: *bucket-init
    profiles: [mac]
    depends_on:
      seaweedfs-mac:
        condition: service_healthy

  caddy-mac:
    <<: *caddy
    profiles: [mac]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      gto:
        aliases: [caddy]

  # The library builder (A1 section 1, A5 section 1, S18): one worker that claims build_job rows, solves
  # each flop through the vendored engine and writes the build to the library bucket. Profiles builder and
  # mac only (O-189); dev-up and e2e are unchanged.
  library-builder:
    profiles: [builder, mac]
    build:
      context: .
      dockerfile: infra/docker/library-builder.Dockerfile
    environment:
      # A5 section 1: 7071 serves /healthz and /metrics inside the network gto only (O-207)
      BUILDER_BIND: "0.0.0.0:7071"
      # O-146: the builder-role connection from its parts, as solver-query does; the pool is lazy, so the
      # service starts before Postgres answers and /healthz reports the database once it does
      BUILDER_DB_HOST: postgres
      BUILDER_DB_SSLMODE: disable
      BUILDER_DB_PASSWORD: ${BUILDER_DB_PASSWORD:?set BUILDER_DB_PASSWORD in .env}
      # ADR 0019: the library bucket through the S3 gateway as the library identity (02 section 6.4)
      S3_ENDPOINT: http://seaweedfs:8333
      S3_LIBRARY_ACCESS_KEY: ${S3_LIBRARY_ACCESS_KEY:?set S3_LIBRARY_ACCESS_KEY in .env}
      S3_LIBRARY_SECRET_KEY: ${S3_LIBRARY_SECRET_KEY:?set S3_LIBRARY_SECRET_KEY in .env}
      # A build is staged on the disk-backed named volume builder-scratch before its upload (plan C.6):
      # a flop build can run to gigabytes, which a tmpfs would take from the 5 GB memory cap
      BUILDER_SCRATCH_DIR: /scratch
      # Empty takes the binary's default: the machine's parallelism and the container's host name
      BUILDER_THREADS: ${BUILDER_THREADS:-}
      BUILDER_WORKER_ID: ${BUILDER_WORKER_ID:-}
      # O-181, O-201: the hand-made ranges the image carries under /fixtures/builder until a preflop
      # solution is packed; a line outside the fixture fails its job with MissingRanges
      BUILDER_RANGES_FIXTURE: ${BUILDER_RANGES_FIXTURE:-/fixtures/builder/bench-bb-btn-srp.ranges.json}
    # A9 section 3, the same hardening as solver-query; the writable paths are /scratch, the staging volume
    # (the image creates it owned by 10001, so a new volume starts with that owner), and a small /tmp
    read_only: true
    tmpfs:
      - /tmp:size=64m
    volumes:
      - builder-scratch:/scratch
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "10001:10001"
    # 02 section 6.2 and O-48: 5 GB for the container, no swap beyond it (the memory cap of O-139 and O-187
    # refuses a solve whose estimate exceeds it before anything is allocated)
    mem_limit: 5g
    memswap_limit: 5g
    restart: unless-stopped
    # The image's healthz self-probe, repeated here so the probe is visible beside the service
    healthcheck:
      test: ["CMD", "/usr/local/bin/library-builder", "healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    # required: false lets one entry serve both profiles: the dev postgres under builder, postgres-mac under
    # mac, and none when the builder profile runs alone against an external database
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      postgres-mac:
        condition: service_healthy
        required: false
      # The library bucket's S3 gateway the same way: seaweedfs under dev, seaweedfs-mac under mac, and
      # none when the bucket is external
      seaweedfs:
        condition: service_healthy
        required: false
      seaweedfs-mac:
        condition: service_healthy
        required: false
    # No ports: 7071 is never published (O-207)
    networks:
      gto: {}

volumes:
  postgres_data: {}
  seaweedfs_data: {}
  caddy_data: {}
  caddy_config: {}
  # The library builder's staging area (BUILDER_SCRATCH_DIR); a build's files live here only until its upload
  builder-scratch: {}

networks:
  gto: {}
