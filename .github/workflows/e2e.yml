# e2e job (R0.3, R0.5, R0.6, R3.13): first just e2e-mock, the Playwright sign-in flow against the mocked
# api with no Docker (O-264); then end-to-end smoke through docker compose. just e2e runs the e2e-stack
# chain: dev-up, db-migrate, db-test, create-owner (a per-run owner with a random password, O-263), smoke,
# e2e-web (the Playwright stack project through Caddy), and dev-down whatever happened before. The dev profile builds the solver-query, api and web images on the runner (O-121): a
# cold Rust release build of solver-query for amd64 only plus the two Node builds, roughly five minutes
# before the stack is up; cargo-chef (infra/docker/README.md) is adopted only if the job passes 15
# minutes. Docker Engine and Compose v2 ship on ubuntu-latest, so nothing installs them.
name: e2e

on:
  pull_request:
  push:
    branches:
      - main
      - "sprint/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      # The pnpm version comes from the packageManager field of package.json; db-test and codegen import
      # pg and kysely from the workspace root, so the install happens before the stack comes up.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # just e2e-mock and just e2e-web drive Chromium; --with-deps also installs the browser's system
      # libraries on the runner. Playwright downloads the browser once per run (an actions/cache on
      # ~/.cache/ms-playwright keyed by the lockfile is optional).
      - name: Install the Playwright Chromium browser (R0.3)
        run: pnpm --filter @g-tee-oh/web exec playwright install --with-deps chromium
      - name: Install dbmate (architecture decision record (ADR) 0005)
        run: npm install -g dbmate@2.37.0
      - name: Create .env with per-run passwords
        # The runner is ephemeral, so the placeholders would do; fresh random values keep two runs from
        # ever sharing a password. Longer tokens are replaced first, so a token that prefixes another is
        # never clobbered by the shorter replacement, and a leftover placeholder fails the step.
        run: |
          cp .env.example .env
          for token in $(grep -oE 'change-me-[a-z0-9-]+' .env | sort -u | awk '{ print length($0), $0 }' | sort -rn | cut -d' ' -f2); do
            sed -i "s/$token/$(openssl rand -hex 16)/g" .env
          done
          if grep -qE 'change-me-[a-z0-9-]+' .env; then
            echo "a change-me placeholder survived the rewrite" >&2
            exit 1
          fi
      # The sign-in flow against the mocked api (O-264): no Docker, so a front-end failure shows here in
      # about a minute, before the image builds. Playwright builds the harness and serves it with vite
      # preview on 4173 (CI is set, so it never reuses a server).
      - name: Mocked-api sign-in flow (R3.13)
        run: just e2e-mock
      # Builds the three images first (O-121, see the header), then runs the chain.
      - name: End-to-end smoke
        env:
          # O-62: the dev profile bind-mounts this directory read-only into solver-query at
          # /fixtures/library; its placeholder README is what S19 replaces with the fixture sets.
          FIXTURE_LIBRARY_PATH: ${{ github.workspace }}/validation/fixtures/library
        run: just e2e
      # The html report and traces of a failed Playwright run. A failure before e2e-web leaves no
      # report, so a missing directory is not an error here.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore
