# rust job (R0.3): formatting, clippy, tests and the solver-query boundary, all through just recipes.
name: rust

on:
  pull_request:
  push:
    branches:
      - main
      - "sprint/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # rust-boundary is a node script (scripts/check-boundary.mjs).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Formatting
        run: just rust-fmt
      - name: Clippy
        run: just rust-clippy
      - name: Tests
        run: just rust-test
      - name: Boundary (solver-query never depends on gto-solve, ADR 0018)
        run: just rust-boundary
      # The gate reports are regenerated here and uploaded as an artifact only; continuous
      # integration (CI) never commits them (contents: read); the committed files are the
      # Zenbook run (O-125).
      - name: Gates G1 to G3 (R2.4 to R2.6)
        run: just gates
        env:
          VALIDATE_MACHINE: github-ubuntu
      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-reports
          path: validation/reports/g*-*.*
          if-no-files-found: error
