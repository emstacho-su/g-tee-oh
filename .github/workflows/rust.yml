# rust job (R0.3): formatting, clippy, tests and the solver-query boundary, all through just recipes.
# tree-hash-arm64 job (R2.9, O-140): the tree-hash golden on an arm64 runner.
name: rust

on:
  pull_request:
  push:
    branches:
      - main
      - "sprint/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # rust-boundary is a node script (scripts/check-boundary.mjs).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Formatting
        run: just rust-fmt
      - name: Clippy
        run: just rust-clippy
      - name: Tests
        run: just rust-test
      - name: Boundary (solver-query never depends on gto-solve, ADR 0018)
        run: just rust-boundary
      # The gate reports are regenerated here and uploaded as an artifact only; continuous
      # integration (CI) never commits them (contents: read); the committed files are the
      # Zenbook run (O-125).
      - name: Gates G1 to G3 (R2.4 to R2.6)
        run: just gates
        env:
          VALIDATE_MACHINE: github-ubuntu
      # Gate G6a in public CI (O-63): the certificate at all 15 depths and the committed library
      # against the recomputation. No chart here: the transcription is never committed, so the
      # report says the chart part is run locally (O-221). just g6a-smoke writes it under
      # target/gate-reports/g6a and leaves the committed validation/reports/g6a-pushfold.*
      # untouched (just g6a refuses to run without the chart, since its output is the committed
      # report). The recipe passes --allow-dirty because the step above has rewritten the
      # committed G1 to G3 reports in this checkout; the report's notes say the tree was dirty.
      - name: Gate G6a push/fold (R2.19)
        run: just g6a-smoke
        env:
          VALIDATE_MACHINE: github-ubuntu
      # Seed determinism of the synthetic sets (O-225): regenerate into target and byte-compare
      # with the committed library (node builtins only, so no node_modules are needed).
      - name: Synthetic fixture sets regenerate byte for byte (R2.20)
        run: just fixtures-check
      # The G4 compare on the committed synthetic tiny pair, no solve and no artifact: the
      # real G4 run and its report are private (R2.11, O-168, O-170). The compare half only:
      # check-reports on its output needs the ts job's node_modules, so just ci runs that.
      - name: Gate G4 smoke on the tiny pair (R2.11)
        run: just g4-smoke
        env:
          VALIDATE_MACHINE: github-ubuntu
      # The G1 to G3 reports this run rewrote, and this run's chart-less G6a report from
      # target. The committed g6a-pushfold files (the Zenbook run with the chart) are left out,
      # so the artifact holds only what this run wrote.
      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-reports
          path: |
            validation/reports/g*-*.*
            !validation/reports/g6a-pushfold.*
            target/gate-reports/g6a/g6a-pushfold.*
          if-no-files-found: error

  # The canonical tree hash is sha256 over integers in little endian with no float, no map
  # order and no usize, so an arm64 runner must reproduce the golden committed from x86
  # (crates/gto-tree/tests/snapshots). The toolchain steps match the rust job; the test
  # is plain cargo, so neither just nor node is needed. S20 rechecks on the Mac.
  tree-hash-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tree-hash golden (R2.9, O-140)
        run: cargo test -p gto-tree --test r2_9_hash
