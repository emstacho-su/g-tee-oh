# ts job (R0.3): lint, type check and tests across the pnpm workspace, all through just recipes.
name: ts

on:
  pull_request:
  push:
    branches:
      - main
      - "sprint/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      # The pnpm version comes from the packageManager field of package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The api integration tests run against the real solver-query binary over the fixture
      # library (O-53, O-244); the cache keeps the debug build incremental between runs.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the fixture solver-query (O-244)
        run: cargo build --locked -p solver-query
      - name: Lint
        run: just ts-lint
      - name: Type check
        run: just ts-typecheck
      - name: Tests
        run: just ts-test
      - name: Coverage of packages/learning at the 80 percent gate (S22, A9 section 1)
        run: just coverage-learning
      - name: Coverage of web/src at the 80 percent gate (S24, A9 section 1)
        run: just coverage-web
      - name: Coverage of services/api at the 80 percent gate (S23, A9 section 1)
        run: just coverage-api
      - name: Boundary (api never invokes the builder, R2.15)
        run: just ts-boundary
      - name: Pending-test tags (R0.11)
        run: just test-tags
      - name: Report schema (R0.11)
        run: just report-check
