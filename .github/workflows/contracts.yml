# contracts job (R0.3, R0.6, R0.7): just contracts regenerates every committed contract artifact
# (the utoipa and Zod OpenAPI documents, the openapi-typescript clients, the Kysely types from the
# migrated database, the schema copies under crates/gto-library) and the job fails on any diff or
# untracked file, so a contract change is always a visible, committed diff (A1 section 3). The
# sqlx offline check runs once a crate carries a query.
name: contracts

on:
  pull_request:
  push:
    branches:
      - main
      - "sprint/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: contracts
          POSTGRES_DB: gto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The service container is ephemeral, so a fixed dev password is acceptable here.
      DATABASE_URL: postgres://postgres:contracts@localhost:5432/gto?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      # Step 1 of just contracts is cargo run -p solver-query, which writes the utoipa document
      # (O-116); sqlx-check needs cargo once a crate carries a query (S16 or S18).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install -g dbmate@2.37.0
      - name: Apply migrations
        run: just db-migrate
      - name: Regenerate the contracts (utoipa, Zod, openapi-typescript, Kysely, schema copies)
        run: just contracts
      - name: sqlx offline metadata
        run: just sqlx-check
      - name: Fail on an uncommitted diff
        run: git diff --exit-code
      # git diff ignores untracked files, so a generated file that was never committed needs this.
      - name: Fail on an untracked generated file
        run: test -z "$(git status --porcelain)"
