# cargo-deny policy for the g-tee-oh workspace (schema version 2).
#
# Mechanism: `cargo deny check licenses` reads every crate in the dependency graph,
# resolves its SPDX license expression (from the manifest, or from a LICENSE file when
# the manifest has none) and rejects any crate whose expression is not satisfied by the
# allow list below. There is no deny list because the allow list is the whole policy:
# a license outside it, which includes every GPL and AGPL family license, fails the
# check until a human adds it here (ADR 0002, license policy).
#
# `cargo deny check advisories` compares the lock file against the RustSec advisory
# database, `check bans` enforces the graph rules and `check sources` restricts where
# crates may come from. The `licenses` and `security` recipes in the justfile run the
# first two; `cargo deny check` with no argument runs all four.

[graph]
# The targets the repository builds: CI and the images on Linux (amd64 and arm64), the Zenbook on
# Windows, the Mac on Apple silicon. An empty list makes cargo-deny walk every target cfg in the
# graph, wasm32 included, which reached webpki-root-certs, a wasm32-only edge of
# rustls-platform-verifier that no binary here links (O-208). The license and ban rules are
# unchanged.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
version = 2
# db-path is left at its default ($CARGO_HOME/advisory-dbs).
db-urls = ["https://github.com/rustsec/advisory-db"]
# A yanked crate in the lock file is an error, not a warning.
yanked = "deny"
# Unmaintained advisories are reported only for crates the workspace depends on
# directly; transitive ones are noise this project cannot act on.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
# Permissive licenses only (ADR 0002). Anything outside this list fails.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "OpenSSL",
]
# askalono must be at least this sure before a LICENSE file counts as a given license.
confidence-threshold = 0.8
# The allow list is a policy, not an inventory of today's dependencies, so do not warn
# when an allowed license is not yet in the graph.
unused-allowed-license = "allow"
exceptions = []

[licenses.private]
# Workspace crates are MIT like everything else, so check them too.
ignore = false
registries = []

[bans]
multiple-versions = "warn"
# A `*` version requirement is an error. Path dependencies carry no version requirement
# and would otherwise count as wildcards, so they are exempted for private crates
# (every workspace member sets publish = false).
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
