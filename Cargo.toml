# Workspace root for g-tee-oh (session S01, R0.1).
#
# Layering (A1 section 2): lower crates never import higher ones.
#   gto-model < gto-tree < gto-solve < gto-library < gto-planner
# Binaries sit on top: solver-query reads the library only (ADR 0018, library-first),
# library-builder, validate and library-pack may solve.
#
# Toolchain pin (O-23): edition 2024 on rustc 1.85 or newer. The vendored engine keeps
# its own edition 2021 manifest and is listed here only as a member.

[workspace]
resolver = "3"
members = [
    "crates/gto-model",
    "crates/gto-tree",
    "crates/gto-solve",
    "crates/gto-library",
    "crates/gto-planner",
    "crates/vendor/postflop-engine",
    "services/solver-query",
    "services/library-builder",
    "tools/validate",
    "tools/library-pack",
]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/emstacho-su/g-tee-oh"
# Nothing in this workspace is published to crates.io; the flag also lets cargo-deny treat
# path dependencies as private (see deny.toml, bans.allow-wildcard-paths).
publish = false

[workspace.dependencies]
# Third party. Versions are pinned to a major so cargo update stays within semver.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
rayon = "1"
# The machine block of a gate report (R2.4 to R2.6, validation/reports/README.md): only
# the `system` feature, for the central processing unit (CPU) model, the core count, the
# memory and the operating system name. 0.36 is the newest release inside the 1.85
# rust-version floor (0.39 needs 1.95). MIT.
sysinfo = { version = "0.36", default-features = false, features = ["system"] }
# Web service stack for solver-query (S06, R0.7, ADR 0018). utoipa-axum 0.3 requires rustc 1.88,
# above the workspace rust-version of 1.85, so the pair is pinned to utoipa 5 with utoipa-axum 0.2.
axum = "0.8"
# tokio 1.54.1 is the floor for RUSTSEC-2026-0384 (1.54.0 is yanked).
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
utoipa = "5"
utoipa-axum = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Test-only HTTP plumbing: tower::ServiceExt::oneshot and response body collection.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Property-based tests (A9 section 2): node-key round trip, suit-permutation invariance,
# quantize then dequantize. Dev-dependency only, declared here so every crate pins one major.
proptest = "1"
# Solutions library format (S14, R2.7, A3 sections 4 and 5). zstd compresses the chunk files;
# default features are off because only the bundled C library is needed (zstd-sys builds it with
# cl.exe on Windows MSVC and the C compiler in the Linux images). sha2 checks every file on first
# open, xxhash-rust supplies the 64-bit xxhash that indexes node keys, and lru holds the decoded
# frames, used unbounded with byte accounting so QUERY_CACHE_BYTES is the only bound.
# zstd 0.14.3 (zstd-safe 8.2) is the floor for RUSTSEC-2026-0391, 0398 and 0403. Its license is
# BSD-3-Clause, inside the deny.toml allow list; the bundled C library (zstd-sys) is unchanged.
zstd = { version = "0.14.3", default-features = false }
sha2 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
lru = "0.19"
# The query-role connection of solver-query (S16, O-28, O-146, O-147): runtime-checked
# sqlx::query (no macros, so no DATABASE_URL at build and no .sqlx directory), the tokio
# runtime, Postgres, and rustls over ring with the native root store. The ring variant is
# chosen over aws-lc-rs because it builds with the C compiler alone, no cmake or NASM, on the
# Windows MSVC toolchain of O-23; the native roots (the image installs ca-certificates) are
# chosen over webpki-roots because that crate's data license, CDLA-Permissive-2.0, is outside
# the deny.toml allow list (ADR 0002). Default features are off: no macros, migrate, any or
# json.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "tls-rustls-ring-native-roots",
] }
# The library-pack command line (S14, R2.8).
clap = { version = "4", features = ["derive"] }
# Seeded generators for synthetic library data (the gto-library "synthetic" feature) and the size
# estimate; the same majors proptest already brings into the lock.
rand = "0.9"
rand_chacha = "0.9"
# Snapshot tests (S14 and S15, one shared line): json for assert_json_snapshot, redactions so the
# sha256 fields of a manifest do not churn on a zstd upgrade. Dev-dependency only.
insta = { version = "1", features = ["json", "redactions"] }
# Scratch directories for writer and pack tests. Dev-dependency only.
tempfile = "3"
# Validates Rust-written manifests against the committed JSON Schema in the gto-library tests.
# Default features are off, which drops the remote reference resolver and its HTTP client.
jsonschema = { version = "0.59", default-features = false }
# Peak heap bytes in the R2.10 estimate and refusal tests (O-139), installed as the global
# allocator of those test binaries only; dev-dependency only.
peak_alloc = "0.2"
# The library bucket client of library-builder (S18, O-183, ADR 0019): object_store's S3
# (Simple Storage Service) client, Apache-2.0 or MIT. The 0.13 line S18 first pinned holds
# quick-xml 0.39 (RUSTSEC-2026-0194 and 0195, fixed from 0.41), so the 0.14 line is used,
# without its `aws` feature: `aws` forces reqwest's `rustls` feature, which selects aws-lc-rs
# (cmake and NASM on the Windows MSVC toolchain, O-23). `aws-base`, `reqwest` and `ring` give
# the same S3 client with SigV4 signing over ring; reqwest runs `rustls-no-provider` and
# library-builder installs rustls's ring provider before it builds the client. Certificates
# go through rustls-platform-verifier (the operating system's store); its webpki-root-certs
# edge (CDLA-Permissive-2.0) exists only on wasm32, which deny.toml's target list leaves out
# (O-208). Default features are off because the local `fs` backend is not used: gto-library's
# FsStore stages a build and this client uploads it. `just licenses` holds the graph to ring,
# no aws-lc-sys and no webpki roots.
object_store = { version = "0.14", default-features = false, features = ["aws-base", "reqwest", "ring"] }
# The HTTP client object_store 0.14 runs on and the TLS library under it, named here only to
# select ring instead of aws-lc-rs (see object_store above, O-208).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# Vendored solver engine (git subtree, see crates/vendor/UPSTREAM-postflop-engine.md).
# The package keeps its upstream name "engine" so subtree pulls merge cleanly; the
# workspace refers to it by the alias postflop-engine.
postflop-engine = { package = "engine", path = "crates/vendor/postflop-engine" }

# Internal crates, so each member declares an edge as `name = { workspace = true }`.
gto-model = { path = "crates/gto-model" }
gto-tree = { path = "crates/gto-tree" }
gto-solve = { path = "crates/gto-solve" }
gto-library = { path = "crates/gto-library" }
gto-planner = { path = "crates/gto-planner" }
# A tool on a tool (O-171): validate reads both G4 dumps through library-pack's node-dump
# types and criterion 2 invariants; library-pack never links gto-solve (O-101).
library-pack = { path = "tools/library-pack" }

[workspace.lints.clippy]
# Groups carry priority -1 so an individual lint entry added later overrides them.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# The engine runs optimised even in debug test builds, so `just rust-test` solves the R2.10
# test spots in seconds while debug assertions stay on (O-140).
[profile.dev.package.engine]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
