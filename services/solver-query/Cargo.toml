[package]
name = "solver-query"
version = "0.1.0"
description = "Query service that answers spot lookups from the solutions library and never solves"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# Edges (A1 section 2): gto-library and gto-model only. The library has no path to gto-solve or
# the vendored engine (O-101), so this read service cannot start a solve (ADR 0018); just
# rust-boundary proves it on the package alone and on the workspace-wide graph. gto-model is the
# vocabulary of the contract (node keys, hands, positions, buckets, the grading floor constants).
[dependencies]
gto-library = { workspace = true }
gto-model = { workspace = true }

# Web service stack (S06, R0.7): axum on tokio, utoipa for the OpenAPI document, tracing for logs.
axum = { workspace = true }
tokio = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# In-process request tests (tower::ServiceExt::oneshot) and response body collection, plus the
# packed synthetic fixture the integration tests build in a temporary directory (plan C.9, O-149):
# gto-library's synthetic generator, library-pack's dump export and pack, and tempfile. None of
# them reaches gto-solve, and dev-dependencies are outside the normal graph rust-boundary checks.
[dev-dependencies]
tower = { workspace = true }
http-body-util = { workspace = true }
gto-library = { workspace = true, features = ["synthetic"] }
library-pack = { path = "../../tools/library-pack" }
tempfile = { workspace = true }

[lints]
workspace = true
