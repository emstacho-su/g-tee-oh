[package]
name = "solver-query"
version = "0.1.0"
description = "Query service that answers spot lookups from the solutions library and never solves"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# Edges (A1 section 2): gto-library only, with its `solve` feature off, so gto-solve and
# the engine never enter this binary's dependency tree (ADR 0018, success criterion 10).
# `just rust-boundary` runs scripts/check-boundary.mjs to prove it on every CI run.
[dependencies]
gto-library = { workspace = true, default-features = false }

[lints]
workspace = true
