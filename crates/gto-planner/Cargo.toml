[package]
name = "gto-planner"
version = "0.1.0"
description = "Build planning: decides which spots the solutions library is missing and in what order"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# Edges (A1 section 2): gto-model and gto-library. The planner reads the library's
# catalogue; it never solves, so it does not enable the library's `solve` feature itself
# (the binaries that link both decide that).
[dependencies]
gto-model = { workspace = true }
gto-library = { workspace = true, default-features = false }
libmcaptcha = "0.2.4"

[lints]
workspace = true
