[package]
name = "gto-tree"
version = "0.1.0"
description = "Betting tree construction from gto-model spot descriptions"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# Edges (A1 section 2): gto-model is the only internal crate. The third party crates parse
# the sizing convention spec (serde, serde_json), name the errors (thiserror) and hash the
# canonical tree bytes (sha2).
[dependencies]
gto-model = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }

# The R2.9 property tests and the tree hash golden.
[dev-dependencies]
proptest = { workspace = true }
insta = { workspace = true }

[lints]
workspace = true
