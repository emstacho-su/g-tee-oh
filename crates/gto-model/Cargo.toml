[package]
name = "gto-model"
version = "0.1.0"
description = "Core domain types for no-limit hold'em shared by every g-tee-oh crate"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# Bottom of the layering (A1 section 2): no internal dependencies, and never gto-solve or
# the vendored engine (ADR 0018). serde carries the plain data types across the library and
# service boundaries; thiserror shapes the one error type.
[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }

# proptest drives the three R2.1 property tests: node-key round trip, suit-permutation
# invariance of the canonical flop, and the flop weights summing to 22,100.
[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
