[package]
name = "gto-library"
version = "0.1.0"
description = "Solutions library: stores solved spots and serves them without starting a solve"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# Edges (A1 section 2): gto-model always; gto-solve only behind the `solve` feature.
#
# Mechanism: a request path must never be able to start a solve (ADR 0018, success
# criterion 10), and `just rust-boundary` proves it by checking that `cargo tree -p
# solver-query` never lists gto-solve. A plain dependency here would put gto-solve in
# that tree through this crate. Making the edge optional keeps it for the writers
# (library-builder, validate, library-pack enable `solve`, which is on by default) while
# solver-query depends on this crate with default-features = false and gets a read-only
# library.
[features]
default = ["solve"]
solve = ["dep:gto-solve"]

[dependencies]
gto-model = { workspace = true }
gto-solve = { workspace = true, optional = true }

[lints]
workspace = true
